<!doctype html>
<!-- README header. Render: chrome --headless=new --force-device-scale-factor=2
     --default-background-color=00000000 --window-size=1280,112
     --screenshot=banner-slim-<theme>.png "file://.../banner.html#<theme>" -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
:root{--bg:#ffffff;--fg:#18181b;--muted:#71717a;--line:#e4e4e7;--prompt:#a1a1aa}
:root[data-theme=dark]{--bg:#09090b;--fg:#fafafa;--muted:#a1a1aa;--line:#27272a;--prompt:#71717a}
html,body{margin:0;background:transparent}
.card{box-sizing:border-box;width:1280px;height:112px;background:var(--bg);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  display:grid;grid-template-columns:112px 1fr auto;grid-template-rows:1fr 4px}
.mark{display:grid;place-items:center;border-right:1px solid var(--line);
  background-image:repeating-linear-gradient(135deg,transparent 0 7px,var(--line) 7px 8px)}
.mark .tile{background:var(--bg);padding:9px 10px;border:1px solid var(--line);border-radius:10px}
.mark svg{display:block;width:52px;height:auto}
.title{display:flex;flex-direction:column;justify-content:center;padding:0 32px}
h1{margin:0;font:600 38px/1 Geist,sans-serif;letter-spacing:-0.04em;color:var(--fg)}
.sub{margin-top:8px;font:400 16px/1.2 Geist,sans-serif;color:var(--muted)}
.sub b{font-weight:500;color:var(--fg)}
.cli{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;padding:0 32px;
  font:400 14px/1.7 "Geist Mono",monospace;color:var(--muted)}
.cli .p{color:var(--prompt)}
.up{display:inline-flex;align-items:center;gap:10px;color:var(--fg)}
.dot{width:8px;height:8px;border-radius:50%;background:#2E7D46;box-shadow:0 0 0 3px color-mix(in oklab,#2E7D46 22%,transparent)}
.strip{grid-column:1 / -1;display:grid;grid-template-columns:repeat(8,1fr)}
.s{background:repeating-linear-gradient(90deg,var(--c) 0 22px,#F1EBDE 22px 34px)}
</style></head>
