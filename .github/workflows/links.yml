name: Link check

# External links in lab guides and posts rot over time. Internal links are
# checked at build time, so only http(s) links are tested here.
on:
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC (08:00/09:00 Toronto)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --scheme https --scheme http
            --exclude-all-private
            --exclude 'linkedin\.com'
            --exclude 'example\.(com|org|net)'
            --accept '200..=299,403,429'
            --max-retries 3
            './content/**/*.mdx' './content/**/*.md' 'README.md'
          output: ./lychee/out.md
          fail: false
      - name: Open an issue for broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken external links
          content-filepath: ./lychee/out.md
          labels: content, links
